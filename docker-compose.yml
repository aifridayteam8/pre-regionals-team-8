version: '3.8'

services:
  app:
    build: .
    container_name: incident-report-generator
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://incident_user:incident_pass@db:5432/incident_reports
      - SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=jwt-secret-key-change-in-production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/reports:/app/backend/reports
      - ./backend/migrations:/app/backend/migrations
    depends_on:
      - db
      - ollama
    networks:
      - incident-network

  db:
    image: postgres:15-alpine
    container_name: incident-db
    environment:
      - POSTGRES_USER=incident_user
      - POSTGRES_PASSWORD=incident_pass
      - POSTGRES_DB=incident_reports
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - incident-network

  ollama:
    image: ollama/ollama:latest
    container_name: incident-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - incident-network

volumes:
  postgres_data:
  ollama_data:

networks:
  incident-network:
    driver: bridge
